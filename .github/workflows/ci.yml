name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Project runtime is Node 20 (Docker base image: node:20-slim);
          # tests use the same version. The action itself runs on the
          # runner's bundled Node 24 — that's controlled by the @v5 tag.
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (with coverage)
        run: npm run test:coverage

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-html
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
