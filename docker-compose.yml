services:
  qbo-mcp:
    build: .
    container_name: qbo-mcp
    ports:
      # Host port mapping. Pick anything free on the host; the in-container
      # port stays 3000. Cloudflare Tunnel (or any reverse proxy) can route
      # your public hostname to this host port.
      - "3033:3000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    restart: unless-stopped
